<!--
  Base page template — assembled by scripts/build-html.js at build time.

  Placeholders:
    {{INCLUDE:path}}    — inlined from templates/path (shared partials)
    {{WF_PAGE_ID}}      — Webflow page ID (from page JSON config)
    {{TITLE}}           — <title> text
    {{META_TAGS}}       — OG / Twitter meta tags
    {{EXTRA_HEAD}}      — page-specific CSS links
    {{CONTENT}}         — main body markup (from *.body.html)
    {{EXTRA_SCRIPTS}}   — page-specific JS (from *.scripts.html)

  Per-page config lives in templates/pages/<name>.json.
-->
<!DOCTYPE html><!--  Last Published: Mon Feb 02 2026 03:33:15 GMT+0000 (Coordinated Universal Time)  -->
<html data-wf-page="{{WF_PAGE_ID}}" data-wf-site="686bc4639f23f7482c1e3135" lang="en">
<head>
  <meta charset="utf-8">
  <title>{{TITLE}}</title>
{{META_TAGS}}
  <meta content="width=device-width, initial-scale=1" name="viewport">
{{INCLUDE:partials/head.html}}
{{EXTRA_HEAD}}
</head>
<body>
  <div class="page-wrapper">
{{INCLUDE:partials/global-styles.html}}
{{INCLUDE:partials/navbar.html}}
    <main class="main-wrapper">
{{CONTENT}}
    </main>
{{INCLUDE:partials/footer.html}}
  </div>
  <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=686bc4639f23f7482c1e3135" type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
  <script src="js/arrow-flint-2025.js" type="text/javascript"></script>
  <script src="js/scroll-reveal.js" type="text/javascript"></script>
{{EXTRA_SCRIPTS}}
</body>
</html>
