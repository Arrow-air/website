      function isLight(hex) {
        var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6;
      }
      function slug(str) { return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

        for (var i = 0; i < PROJECTS.length; i++) if (PROJECTS[i].id === id) return PROJECTS[i];

      // ---------------------------------------------------------------
      // Shared pill + stem positioning (main bar and project bar)
      // ---------------------------------------------------------------
      function positionIndicator(list, ind, tab, stemEl) {
        // offsetLeft already includes the track's 4px padding, and the
        // absolutely positioned pill measures from the padding edge, so the
        // two line up without an adjustment.
        var x = tab.offsetLeft;
        ind.style.width = tab.offsetWidth + 'px';
        ind.style.transform = 'translateX(' + x + 'px)';
        var tabRect = tab.getBoundingClientRect();
        var wrapRect = stemEl.parentNode.getBoundingClientRect();
        stemEl.style.left = (tabRect.left + tabRect.width / 2 - wrapRect.left) + 'px';
      }

      function selectIn(list, ind, tabEls, tab, stemEl) {
        tabEls.forEach(function (t) {
          var on = t === tab;
          t.setAttribute('aria-selected', on ? 'true' : 'false');
          t.tabIndex = on ? 0 : -1;
        });
        positionIndicator(list, ind, tab, stemEl);
        tab.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
      }

      // ---------------------------------------------------------------

        loaderText.textContent = text;
        loader.classList.remove('is-visible');
        void loader.offsetWidth;
        loader.classList.add('is-visible');
        loadTimer = setTimeout(function () {
          loader.classList.remove('is-visible');
          done();
        }, LOAD_MS);
      }

      var OB_KEY = 'arrow-app-onboarding';
      function obState() {
        try { return JSON.parse(localStorage.getItem(OB_KEY) || '{}'); } catch (e) { return {}; }
      }
      function obSave(st) { try { localStorage.setItem(OB_KEY, JSON.stringify(st)); } catch (e) {} }

      function questCard(q, done) {
        return '<div class="q' + (done ? ' is-done' : '') + '" data-quest="' + q.id + '"><div class="q_in">' +
          '<div class="q_icon">' + (done ? ICONS.check : ICONS[q.icon]) + '</div>' +

            '<span class="q_reward">' + (done ? '' : '+') + q.reward + ' $ARROW</span>' +

              ? '<button class="q_mark" type="button" data-undo="' + q.id + '">undo</button>'
              : '<a class="q_btn" href="' + q.href + '"' + (/^https?:/.test(q.href) ? ' target="_blank" rel="noopener"' : '') + '>' + q.cta + '</a>' +
                '<button class="q_mark" type="button" data-done="' + q.id + '">mark done</button>') +
          '</div>' +
        '</div></div>';
      }

      function renderOnboarding() {
        var st = obState();
        var doneCount = QUESTS.filter(function (q) { return st[q.id]; }).length;
        var earned = QUESTS.reduce(function (n, q) { return n + (st[q.id] ? q.reward : 0); }, 0);
        var feat = QUESTS.filter(function (q) { return q.featured && !st[q.id]; })[0];

        document.getElementById('ob-ring').setAttribute('stroke-dashoffset', String(113 - 113 * doneCount / QUESTS.length));
        document.getElementById('ob-ring-text').textContent = doneCount + '/' + QUESTS.length;
        document.getElementById('ob-earned').textContent = earned.toLocaleString();
        document.getElementById('ob-left').textContent = doneCount === QUESTS.length ? 'all done' : (QUESTS.length - doneCount) + ' step' + (QUESTS.length - doneCount === 1 ? '' : 's') + ' left';
        document.getElementById('ob-bar').style.width = (100 * doneCount / QUESTS.length) + '%';
        document.getElementById('ob-done').classList.toggle('is-on', doneCount === QUESTS.length);

        document.getElementById('ob-feat').innerHTML = feat
          ? '<div class="ob_feat"><div class="ob_icon">' + ICONS[feat.icon] + '</div>' +
            '<div><div class="ob_feat_tag">' + feat.tag + '</div><h3 class="q_title">' + feat.title + '</h3><p class="q_desc">' + feat.desc + '</p></div>' +
            '<div class="q_side"><span class="q_reward">+' + feat.reward + ' $ARROW</span><a class="q_btn is-primary" href="' + feat.href + '" target="_blank" rel="noopener">' + feat.cta + '</a><button class="q_mark" type="button" data-done="' + feat.id + '">mark done</button></div></div>'
          : '';
        document.getElementById('ob-grid').innerHTML = QUESTS.filter(function (q) { return !(q.featured && !st[q.id]); }).map(function (q) { return questCard(q, !!st[q.id]); }).join('');
      }

      document.getElementById('view-onboarding').addEventListener('click', function (e) {

            }).join('') +
          '</div>';
        }).join('') + '</div>' +
        '<div class="kb_foot">Dummy board. Will mirror the ' + p.name + ' GitHub Projects view. Drag cards to try it.</div>';
      }

      function wireKanban(p) {
        var board = document.getElementById('kb');
        if (!board) return;
        var dragging = null;
        board.addEventListener('dragstart', function (e) {
          var card = e.target.closest('.kb_card');
          if (!card) return;
          dragging = card;
          card.classList.add('is-dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', card.getAttribute('data-n'));
        });
        board.addEventListener('dragend', function () {
          if (dragging) dragging.classList.remove('is-dragging');
          dragging = null;
          board.querySelectorAll('.kb_col').forEach(function (c) { c.classList.remove('is-over'); });
        });
        board.addEventListener('dragover', function (e) {
          var col = e.target.closest('.kb_col');
          if (!col) return;
          e.preventDefault();
          board.querySelectorAll('.kb_col').forEach(function (c) { c.classList.toggle('is-over', c === col); });
        });
        board.addEventListener('drop', function (e) {
          var col = e.target.closest('.kb_col');
          if (!col || !dragging) return;
          e.preventDefault();
          kbState[p.id][dragging.getAttribute('data-n')] = col.getAttribute('data-col');
          projPanel.querySelector('#kb').outerHTML = renderKanban(p).replace(/<div class="kb_foot">[\s\S]*$/, '');
          wireKanban(p);
        });
      }


      // ---------------------------------------------------------------
      // Team: contributors to the project's repo, live from the GitHub
      // contributors API (avatar, commits), merged with a profile map
      // for bio and disciplines. The profile map is a stand-in for the
      // contributor CRM / src/data/contributors.json until that is wired;
      // anyone without an entry shows as "profile pending".
      // Discipline colours follow src/data/disciplines.json categories.
      // ---------------------------------------------------------------
      var DISC_COLOR = {
        Engineering: '#3B69D1', 'Flight Systems': '#218191', 'Flight Ops': '#5B8DEE', Manufacturing: '#FF643B',
        Design: '#C497FF', Content: '#AF947E', Growth: '#22c55e', Local: '#70C9D9', Operations: '#B0B4BD'
      };
      var DISC_CAT = {
        Mechanical: 'Engineering', CAD: 'Engineering', Electrical: 'Engineering', Aerodynamics: 'Engineering', Power: 'Engineering', Propulsion: 'Engineering', Certification: 'Engineering', Safety: 'Engineering',
        Firmware: 'Flight Systems', Software: 'Flight Systems', Controls: 'Flight Systems', Autonomy: 'Flight Systems', Telemetry: 'Flight Systems', Simulation: 'Flight Systems',
        Piloting: 'Flight Ops', 'Flight Test': 'Flight Ops', Maintenance: 'Flight Ops', Support: 'Flight Ops', Regulatory: 'Flight Ops', Missions: 'Flight Ops',
        '3D Printing': 'Manufacturing', Machining: 'Manufacturing', Composites: 'Manufacturing', Assembly: 'Manufacturing', Sourcing: 'Manufacturing', Quality: 'Manufacturing',
        Industrial: 'Design', Interface: 'Design', Graphics: 'Design',
        Documentation: 'Content', Media: 'Content', 'Social Media': 'Content',
        Marketing: 'Growth', Community: 'Growth', 'Business Development': 'Growth',
        Hosting: 'Local', Workshops: 'Local', Vertiports: 'Local',
        Governance: 'Operations', Tokenomics: 'Operations', Coordination: 'Operations', Legal: 'Operations', Tooling: 'Operations'
      };
      var PROFILES = {
        DowFisherKBM: { name: 'Dow Fisher', bio: 'Quiver mechanical lead. Frames, plates, the parts that take the load.', disciplines: ['Mechanical', 'CAD', 'Assembly'] },
        errrks: { name: 'Erik', bio: 'CAD and build123d. Keeps the parametric assembly honest.', disciplines: ['CAD', 'Mechanical', '3D Printing'] },
        alperenag: { name: 'Alperen', bio: 'Aircraft and flight test. Runs the Spearhead campaign from Ankara.', disciplines: ['Aerodynamics', 'Flight Test', 'Piloting'] },
        thomasgarrison: { name: 'Thomas Garrison', bio: 'Docs and flight logs. Texas test site.', disciplines: ['Documentation', 'Flight Test'] },
        ZeynepB5793: { name: 'Zeynep', bio: 'Electrical. LiDAR, Ethernet and sensor integration on Quiver.', disciplines: ['Electrical', 'Firmware'] },
        sl33ty: { name: 'Sleety', bio: 'From Armagh, living in Belfast/Banbridge. Been with Arrow since 2021.', disciplines: ['Documentation', 'Marketing', 'Community'] }
      };
      var teamCache = {};

      function teamCard(c, max) {
        var prof = PROFILES[c.login];
        var pct = Math.max(4, Math.round(100 * c.contributions / max));
        return '<div class="tm_card">' +
          '<img class="tm_avatar" src="' + c.avatar_url + '&s=112" alt="" loading="lazy">' +
          '<div>' +
            '<div class="tm_top"><h4 class="tm_name"><a href="' + c.html_url + '" target="_blank" rel="noopener">' + (prof ? prof.name : c.login) + '</a></h4><span class="tm_handle">@' + c.login + '</span></div>' +
            '<p class="tm_bio' + (prof ? '' : ' is-pending') + '">' + (prof ? prof.bio : 'No contributor profile yet.') + '</p>' +
            '<div class="tm_contrib"><b>' + c.contributions + '</b> commits <div class="tm_bar"><span style="width:' + pct + '%"></span></div></div>' +
            '<div class="tm_tags">' + (prof
              ? prof.disciplines.map(function (d) { var cat = DISC_CAT[d] || 'Operations'; return '<span class="tm_tag is-cat" style="--tm-c:' + DISC_COLOR[cat] + '" title="' + cat + '">' + d + '</span>'; }).join('')
              : '<span class="tm_tag is-pending">disciplines pending</span>') +
            '</div>' +
          '</div>' +
        '</div>';
      }

      function renderTeam(p) {
        var host = document.getElementById('tm-host');
        if (!host || !p.repo) return;
        var render = function (list) {
          var people = list.filter(function (c) { return c.type !== 'Bot' && !/\[bot\]$/.test(c.login); });
          var max = people.reduce(function (m, c) { return Math.max(m, c.contributions); }, 1);
          var withProfile = people.filter(function (c) { return PROFILES[c.login]; }).length;
          document.getElementById('tm-count').textContent = people.length + ' contributors, ' + withProfile + ' with profiles';
          host.innerHTML = '<div class="tm">' + people.map(function (c) { return teamCard(c, max); }).join('') + '</div>';
        };
        if (teamCache[p.repo]) { render(teamCache[p.repo]); return; }
        fetch('https://api.github.com/repos/Arrow-air/' + p.repo + '/contributors?per_page=50').then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        }).then(function (list) {
          teamCache[p.repo] = list;
          if (document.getElementById('tm-host') === host) render(list);
        }).catch(function (err) {
          host.innerHTML = '<div class="bt_empty">Could not load contributors from GitHub (' + err.message + ').</div>';
        });
      }

      // ---------------------------------------------------------------
      // Contribute: cards
      // ---------------------------------------------------------------
      var MARK = '<svg viewBox="0 0 163 194" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="M162.9,120.1l-50.36-11.17-31.09,84.49-31.09-84.49L0,120.1,81.45,0l81.45,120.1Z"/></svg>';

      // Card media: the docs site's dithered card art at rest, the colour
      // render on hover. Projects without art get the Arrow mark.
      function cardMedia(p) {
        if (!p.img) return '<div class="cf_media"><div class="cf_media_mark" style="color:' + p.color + '">' + MARK + '</div></div>';
        return '<div class="cf_media">' +
          '<img class="is-rest" src="/img/card-' + p.img + '_dark-unhover.png" alt="" loading="lazy">' +
          '<img class="is-hover" src="/img/' + (p.imgHover || 'card-' + p.img + '_hover.png') + '" alt="" loading="lazy">' +
        '</div>';
      }

      function renderCards() {
        grid.innerHTML = PROJECTS.map(function (p) {
          return '' +
            '<a class="cf" href="#contribute/' + p.id + '" style="--cf-color:' + p.color + '">' +
              cardMedia(p) +
              '<div class="cf_body">' +
                '<h3 class="cf_title">' + p.name + '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></h3>' +
                '<p class="cf_desc">' + p.blurb + '</p>' +
              '</div>' +
            '</a>';
        }).join('');
      }

      // ---------------------------------------------------------------
      // Contribute: project shell
      // ---------------------------------------------------------------
      function buildProjectTabs(p) {
        var names = p.tabs || BASE_TABS;
        projTabs.querySelectorAll('.app-tab').forEach(function (t) { t.remove(); });
        names.forEach(function (name, i) {
          var b = document.createElement('button');
          b.className = 'app-tab';
          b.type = 'button';
          b.setAttribute('role', 'tab');
          b.setAttribute('data-sub', slug(name));
          b.setAttribute('aria-selected', 'false');
          b.tabIndex = -1;
          b.innerHTML = '<span class="app-tab_num">' + String(i + 1).padStart(2, '0') + '</span>' + name;
          b.addEventListener('click', function () {
            location.hash = '#contribute/' + p.id + '/' + slug(name);
          });
          projTabs.appendChild(b);
        });
      }

      function disposeViewer() {
        if (viewer && viewer.dispose) viewer.dispose();
        viewer = null;
      }

      function mountViewer(host, opts) {
        var start = function () {
          window.ArrowViewer.mount(host, opts).then(function (v) {
            viewer = v;
            var l = host.querySelector('.v3d_loading');
            if (l) l.remove();
          }).catch(function (err) {
            host.innerHTML = '<div class="v3d_loading">Could not load the model (' + err + ')</div>';
          });
        };
        if (window.ArrowViewer) start();
        else window.addEventListener('arrow-viewer-ready', start, { once: true });
      }

      function renderProjectView(p, sub) {
        var names = p.tabs || BASE_TABS;
        var title = names.filter(function (n) { return slug(n) === sub; })[0] || names[0];
        disposeViewer();

        if (p.viewer && sub === 'overview') {
          var mineV = BOUNTIES.filter(function (b) { return b.project === p.id; });
          projPanel.innerHTML =
            '<div class="proj_kicker">' + p.name + ' / ' + title + '</div>' +
            '<h3>' + p.name + ', assembled</h3>' +
            '<p>Orbit the aircraft. Hover a component to see what it is, click it to go deeper.</p>' +
            frame(p.name + ' assembly', mineV.length + ' bounties', 'drag to orbit, click a part',
              '<div class="v3d" id="v3d">' +
                '<div class="v3d_loading">Loading model</div>' +
                '<div class="v3d_tip" id="v3d-tip"></div>' +
                '<div class="v3d_hint">drag to orbit &middot; scroll to zoom &middot; click a part</div>' +
              '</div>' +
              frameRow('Open bounties on ' + p.name, 'paid in USDC and $ARROW') +
              bountyTable(mineV)) +
            '<div class="sec"><div class="sec_head"><h4>How to get involved</h4><span>5 steps</span></div>' + improveSteps(p, p.name + ' assembly') + '</div>' +
            aboutSection(p);
          loadAbout(p);
          var host = document.getElementById('v3d');
          var tip = document.getElementById('v3d-tip');
          mountViewer(host, {
            base: '/app-models',
            accent: p.color,
            onHover: function (info) {
              if (!info) { tip.classList.remove('is-on'); return; }
              tip.innerHTML = info.label + ' <span>/ ' + info.system + '</span>';
              tip.classList.add('is-on');
            },
            onPick: function (info) {
              location.hash = '#contribute/' + p.id + '/component/' + encodeURIComponent(info.file + ':' + info.mesh);
            }
          });
          return;
        }

        if (p.viewer && sub === 'component') {
          var key = state.component ? decodeURIComponent(state.component) : '';
          var file = key.split(':')[0];
          var mesh = key.split(':').slice(1).join(':');
          if (!file) {
            projPanel.innerHTML =
              '<div class="proj_kicker">' + p.name + ' / ' + title + '</div>' +
              '<h3>' + title + '</h3>' +
              '<div class="v3d_empty">No component selected. Pick one in the <a href="#contribute/' + p.id + '/overview">3D overview</a>.</div>';
            return;
          }
          var systemLabel = file.replace(/^\d+_/, '').replace(/\.glb$/, '').replace(/_/g, ' ');
          var label = mesh.replace(/_\d+$/, '').replace(/[-_]/g, ' ') || 'component';
          projPanel.innerHTML =
            '<div class="v3d_crumbs"><a href="#contribute/' + p.id + '/overview">' + p.name + '</a> / <a href="#contribute/' + p.id + '/overview">' + systemLabel + '</a> / <b>' + label + '</b></div>' +
            '<h3>' + label + '</h3>' +
            '<p style="margin-bottom:1rem">Same CAD for now. Each component will link to its own model, drawings and tasks.</p>' +
            componentSections(p, file, mesh, label) +
            aboutSection(p);
          loadAbout(p);
          mountViewer(document.getElementById('v3d'), { base: '/app-models', accent: p.color, focus: { file: file, mesh: mesh } });
          return;
        }

        if (sub === 'team') {
          projPanel.innerHTML =
            '<div class="proj_kicker">' + p.name + ' / ' + title + '</div>' +
            '<h3>People on ' + p.name + '</h3>' +
            '<p style="margin-bottom:1.25rem">Everyone who has landed a commit on ' + (p.repo ? 'Arrow-air/' + p.repo : 'this project') + '. <span id="tm-count" class="tm_handle"></span></p>' +
            '<div id="tm-host"><div class="bt_empty">Loading contributors from GitHub</div></div>';
          renderTeam(p);
          return;
        }
        if (sub === 'tasks') {
          var open = (TASKS[p.id] || []).filter(function (t) { return t.col !== 'done'; }).length;
          projPanel.innerHTML =
            '<div class="proj_kicker">' + p.name + ' / ' + title + '</div>' +
            '<h3>Active tasks</h3>' +
            '<p style="margin-bottom:1.25rem">' + open + ' open across issues and pull requests.</p>' +
            renderKanban(p);
          wireKanban(p);
          return;
        }
        if (sub === 'overview') {
          var mine = BOUNTIES.filter(function (b) { return b.project === p.id; });
          projPanel.innerHTML =
            '<div class="proj_kicker">' + p.name + ' / ' + title + '</div>' +
            '<h3>' + p.name + '</h3>' +
            '<p>' + p.blurb + '</p>' +
            bountyFrame('Open bounties on ' + p.name, mine.length + ' listed', 'paid in USDC and $ARROW', bountyTable(mine)) +
            '<div class="sec"><div class="sec_head"><h4>How to get involved</h4><span>5 steps</span></div>' + improveSteps(p, p.name) + '</div>' +
            aboutSection(p);
          loadAbout(p);
          return;
        }
        projPanel.innerHTML =
          '<div class="proj_kicker">' + p.name + ' / ' + title + '</div>' +
          '<h3>' + title + '</h3>' +
          '<p>Placeholder for the ' + p.name + ' ' + title.toLowerCase() + ' view.</p>';
      }


      // ---------------------------------------------------------------
      // About: the project's README from GitHub, rendered below the
      // viewer, bounties and steps. Fetched once per project.
      // ---------------------------------------------------------------
      var readmeCache = {};
      function aboutSection(p) {
        if (!p.repo) return '';
        return '<div class="sec" id="about-sec"><div class="sec_head"><h4>About ' + p.name + '</h4>' +
          '<span><a class="sec_link" href="https://github.com/Arrow-air/' + p.repo + '" target="_blank" rel="noopener">github.com/Arrow-air/' + p.repo + '</a></span></div>' +
          '<div class="readme" id="about-body"><div class="bt_empty">Loading README from GitHub</div></div></div>';
      }
      function loadAbout(p) {
        var body = document.getElementById('about-body');
        if (!p.repo || !body) return;
        var render = function (md) {
          if (!window.marked) { body.innerHTML = '<pre class="readme_raw">' + md.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }) + '</pre>'; return; }
          var rawBase = 'https://raw.githubusercontent.com/Arrow-air/' + p.repo + '/main/';
          var blobBase = 'https://github.com/Arrow-air/' + p.repo + '/blob/main/';
          var renderer = new marked.Renderer();
          renderer.image = function (href, title, text) {
            var src = typeof href === 'object' ? href.href : href;
            var alt = typeof href === 'object' ? href.text : text;
            if (!/^https?:/.test(src)) src = rawBase + src.replace(/^\.\//, '');
            return '<img src="' + src + '" alt="' + (alt || '') + '" loading="lazy">';
          };
          renderer.link = function (href, title, text) {
            var h = typeof href === 'object' ? href.href : href;
            var t = typeof href === 'object' ? href.text : text;
            if (!/^https?:|^#|^mailto:/.test(h)) h = blobBase + h.replace(/^\.\//, '');
            return '<a href="' + h + '" target="_blank" rel="noopener">' + t + '</a>';
          };
          body.innerHTML = marked.parse(md, { renderer: renderer, gfm: true });
        };
        if (readmeCache[p.repo]) { render(readmeCache[p.repo]); return; }
        var tryBranch = function (branch) {
          return fetch('https://raw.githubusercontent.com/Arrow-air/' + p.repo + '/' + branch + '/README.md').then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
          });
        };
        tryBranch('main').catch(function () { return tryBranch('master'); }).then(function (md) {
          readmeCache[p.repo] = md;
          if (document.getElementById('about-body') === body) render(md);
        }).catch(function (err) {
          body.innerHTML = '<div class="bt_empty">Could not load the README (' + err.message + ').</div>';
        });
      }

      function componentSections(p, file, mesh, label) {
        var all = BOUNTIES.filter(function (b) { return b.project === p.id; });
        var related = all.filter(function (b) { return bountyMatches(b, file, mesh); });
        var rest = all.filter(function (b) { return !bountyMatches(b, file, mesh); });
        var viewerHtml =
          '<div class="v3d" id="v3d">' +
            '<div class="v3d_loading">Loading model</div>' +
            '<div class="v3d_hint">drag to orbit &middot; scroll to zoom</div>' +
          '</div>';
        var html = frame(label, related.length ? related.length + ' related' : '', 'same CAD for now',
          viewerHtml + (related.length ? frameRow('Bounties on this component', 'paid in USDC and $ARROW') + bountyTable(related, { file: file, mesh: mesh }) : ''));
        html += '<div class="sec"><div class="sec_head"><h4>' + (related.length ? 'Or improve it your own way' : 'How to improve this component') + '</h4><span>5 steps</span></div>' +
          improveSteps(p, label) + '</div>';
        html += bountyFrame(related.length ? 'Other ' + p.name + ' bounties' : 'All ' + p.name + ' bounties', rest.length + ' listed', 'paid in USDC and $ARROW', bountyTable(rest));
        return html;
      }

      function showProject(p, sub, opts) {
        opts = opts || {};
        var names = p.tabs || BASE_TABS;
        var validSub = names.map(slug).indexOf(sub) >= 0 ? sub : slug(names[0]);
        var projectChanged = state.project !== p.id;

        if (projectChanged) {
          projShell.style.setProperty('--proj', p.color);
          projShell.style.setProperty('--proj-ink', isLight(p.color) ? '#101113' : '#ffffff');
          projName.textContent = p.name;
          buildProjectTabs(p);
        }
        gridWrap.style.display = 'none';
        projShell.classList.add('is-active');

        var subTabs = Array.prototype.slice.call(projTabs.querySelectorAll('.app-tab'));
        var active = subTabs.filter(function (t) { return t.getAttribute('data-sub') === validSub; })[0];

        function commit() {
          selectIn(projTabs, projIndicator, subTabs, active, projStem);
          renderProjectView(p, validSub);
        }

        var subChanged = state.sub !== validSub || state.component !== (opts.extra || null);
        state.project = p.id;
        state.sub = validSub;
        state.component = opts.extra || null;

        if (opts.instant || (!projectChanged && !subChanged)) {
          commit();
          // Layout settles after display flips; re-measure once.
          requestAnimationFrame(function () { positionIndicator(projTabs, projIndicator, active, projStem); });
        } else {
          selectIn(projTabs, projIndicator, subTabs, active, projStem);
          runLoader('Loading ' + p.name.toLowerCase() + (projectChanged ? '' : ' ' + validSub.replace(/-/g, ' ')), p.color, commit);
        }
      }

      function showGrid() {
        disposeViewer();
        projShell.classList.remove('is-active');
        gridWrap.style.display = '';
        state.project = null;
        state.sub = null;
      }

      // ---------------------------------------------------------------
      // Routing: #main, #contribute/project, #contribute/project/sub
      // ---------------------------------------------------------------
      function parseHash() {
        var parts = location.hash.replace(/^#/, '').split('/').filter(Boolean);
        return { main: parts[0] || tabs[0].getAttribute('data-tab'), project: parts[1] || null, sub: parts[2] || null, extra: parts[3] || null };
      }

      function showView(name) {
        views.forEach(function (v) { v.classList.toggle('is-active', v.id === 'view-' + name); });
      }

      function route(opts) {
        opts = opts || {};
        var r = parseHash();
        var tab = tabs.filter(function (t) { return t.getAttribute('data-tab') === r.main; })[0] || tabs[0];
        var main = tab.getAttribute('data-tab');
        var mainChanged = state.main !== main;

        if (mainChanged) {
          state.main = main;
          selectIn(tablist, indicator, tabs, tab, stem);
          panelIndex.textContent = String(tabs.indexOf(tab) + 1).padStart(2, '0');
          panelTitle.textContent = labelOf(tab);
        }

        function afterMain() {
          showView(main);
          if (main === 'contribute') {
            var p = r.project ? findProject(r.project) : null;
            if (p) showProject(p, r.sub, { instant: mainChanged || opts.instant, extra: r.extra });
            else showGrid();
          }
        }

        if (mainChanged && !opts.instant) {
          if (main === 'contribute') showGrid();
          runLoader('Loading ' + labelOf(tab).toLowerCase(), BLUE, afterMain);
        } else {
          afterMain();
        }
      }

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          location.hash = '#' + tab.getAttribute('data-tab');
        });
      });

      function keyNav(list, e) {
        var els = Array.prototype.slice.call(list.querySelectorAll('.app-tab'));
        var i = els.indexOf(document.activeElement);
        if (i < 0) return;
        var next = null;
        if (e.key === 'ArrowRight') next = els[(i + 1) % els.length];
        if (e.key === 'ArrowLeft') next = els[(i - 1 + els.length) % els.length];
        if (e.key === 'Home') next = els[0];
        if (e.key === 'End') next = els[els.length - 1];
        if (next) { e.preventDefault(); next.focus(); next.click(); }
      }
      tablist.addEventListener('keydown', function (e) { keyNav(tablist, e); });
      projTabs.addEventListener('keydown', function (e) { keyNav(projTabs, e); });

      // Fill the viewport below the sticky tab bar, leaving the shell's bottom padding.
      function sizePanel() {
        var top = panel.getBoundingClientRect().top + window.scrollY;
        var h = window.innerHeight - top - 24;
        panel.style.setProperty('--app-panel-h', Math.max(h, 320) + 'px');
      }

      window.addEventListener('resize', function () {
        sizePanel();
        var active = tabs.filter(function (t) { return t.getAttribute('aria-selected') === 'true'; })[0];
        if (active) positionIndicator(tablist, indicator, active, stem);
        if (state.project) {
          var sa = projTabs.querySelector('.app-tab[aria-selected="true"]');
          if (sa) positionIndicator(projTabs, projIndicator, sa, projStem);
        }
      });

      window.addEventListener('hashchange', function () { route(); });

      renderCards();
      renderOnboarding();
      sizePanel();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { route({ instant: true }); });
      } else {
        route({ instant: true });
      }
    })();
  </script>
