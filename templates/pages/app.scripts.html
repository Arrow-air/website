  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import { mount } from '/js/app-viewer.js';
    window.ArrowViewer = { mount: mount };
    window.dispatchEvent(new Event('arrow-viewer-ready'));
  </script>
  <script>
    (function () {
      var LOAD_MS = 800;
      var BLUE = '#5B8DEE';

      // ---------------------------------------------------------------
      // Project data. One entry per card on the Contribute tab.
      // color: theme for the project's own tab group, drawn from the
      // brand scales at /docs/contributing/arrow-brand (Blue, Teal,
      // Orange, Purple, Tan, Slate). Light values get dark ink on the pill.
      // ---------------------------------------------------------------
      var BASE_TABS = ['Overview', 'Tasks', 'Docs', 'Team', 'Discuss'];
      var PROJECTS = [
        { id: 'spearhead', name: 'Spearhead', blurb: 'Fixed-wing VTOL demonstrator.', img: 'spearhead', imgHover: 'card-spearhead_dark-hover.png', color: '#FF643B', tabs: ['Overview', 'Tasks', 'Docs', 'Flight logs', 'Team', 'Discuss'] },
        { id: 'quiver', name: 'Quiver', blurb: 'Open-source devkit quadcopter.', img: 'quiver', color: '#218191', tabs: ['Overview', 'Component', 'Tasks', 'Docs', 'Team', 'Discuss'], viewer: true },
        { id: 'caribou', name: 'Caribou', blurb: 'Heavy-lift hexacopter for ag spraying.', img: 'caribou', color: '#0943BF' },
        { id: 'longshot', name: 'Longshot', blurb: 'Community-built 2.3 kWh battery pack.', img: 'longshot', color: '#8234F0' },
        { id: 'feather', name: 'Feather', blurb: 'Open fixed-wing UAV.', img: 'feather', color: '#AF947E' },
        { id: 'kestrel', name: 'Kestrel', blurb: 'Next aircraft. Scope being defined.', color: '#70C9D9' },
        { id: 'superapp', name: 'Superapp', blurb: 'This app.', img: 'app', color: '#2A5DCB' },
        { id: 'software', name: 'Software', blurb: 'Firmware and tooling around the aircraft.', color: '#B0B4BD' },
        { id: 'flight-testing', name: 'Flight Testing', blurb: 'Test campaigns and flight logs.', color: '#FF906E' },
        { id: 'growth', name: 'Growth & Community', blurb: 'Media, social and the people side.', color: '#C497FF' }
      ];

      // ---------------------------------------------------------------
      // Elements
      // ---------------------------------------------------------------
      var tablist = document.getElementById('app-tabs');
      var tabs = Array.prototype.slice.call(tablist.querySelectorAll('.app-tab'));
      var indicator = tablist.querySelector('.app-tabs_indicator');
      var stem = document.getElementById('app-stem');
      var loader = document.getElementById('app-loader');
      var loaderText = document.getElementById('app-loader-text');
      var panel = document.getElementById('app-panel');
      var panelIndex = document.getElementById('app-panel-index');
      var panelTitle = document.getElementById('app-panel-title');
      var views = Array.prototype.slice.call(document.querySelectorAll('.app-view'));

      var grid = document.getElementById('contribute-grid');
      var gridWrap = document.getElementById('contribute-grid-wrap');
      var projShell = document.getElementById('proj-shell');
      var projName = document.getElementById('proj-name');
      var projTabs = document.getElementById('proj-tabs');
      var projIndicator = projTabs.querySelector('.app-tabs_indicator');
      var projStem = document.getElementById('proj-stem');
      var projPanel = document.getElementById('proj-panel');

      var state = { main: null, project: null, sub: null, component: null };
      var viewer = null;
      var loadTimer = null;

      function isLight(hex) {
        var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6;
      }
      function slug(str) { return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
      function labelOf(tab) { return tab.textContent.replace(/^\d+\s*/, '').trim(); }
      function findProject(id) {
        for (var i = 0; i < PROJECTS.length; i++) if (PROJECTS[i].id === id) return PROJECTS[i];
        return null;
      }

      // ---------------------------------------------------------------
      // Shared pill + stem positioning (main bar and project bar)
      // ---------------------------------------------------------------
      function positionIndicator(list, ind, tab, stemEl) {
        var x = tab.offsetLeft - 4; // track has 4px padding
        ind.style.width = tab.offsetWidth + 'px';
        ind.style.transform = 'translateX(' + x + 'px)';
        var tabRect = tab.getBoundingClientRect();
        var wrapRect = stemEl.parentNode.getBoundingClientRect();
        stemEl.style.left = (tabRect.left + tabRect.width / 2 - wrapRect.left) + 'px';
      }

      function selectIn(list, ind, tabEls, tab, stemEl) {
        tabEls.forEach(function (t) {
          var on = t === tab;
          t.setAttribute('aria-selected', on ? 'true' : 'false');
          t.tabIndex = on ? 0 : -1;
        });
        positionIndicator(list, ind, tab, stemEl);
        tab.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
      }

      // ---------------------------------------------------------------
      // Loader
      // ---------------------------------------------------------------
      function runLoader(text, color, done) {
        if (loadTimer) clearTimeout(loadTimer);
        loader.style.setProperty('--loader-color', color || BLUE);
        loaderText.textContent = text;
        loader.classList.remove('is-visible');
        void loader.offsetWidth;
        loader.classList.add('is-visible');
        loadTimer = setTimeout(function () {
          loader.classList.remove('is-visible');
          done();
        }, LOAD_MS);
      }


      // ---------------------------------------------------------------
      // Onboarding quests. Illustrative only: rewards are placeholder
      // numbers and "done" is a localStorage flag, not a verified event.
      // ---------------------------------------------------------------
      var ICONS = {
        mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
        user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
        x: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 3h3l-7.1 8.1L21.7 21h-6.5l-4.6-6-5.3 6H2.3l7.6-8.7L2 3h6.6l4.2 5.5L17.5 3zm-1.1 16.2h1.7L7.7 4.7H5.9l10.5 14.5z"/></svg>',
        shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>',
        chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.2A8 8 0 1 1 21 12z"/></svg>',
        call: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>',
        issue: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>',
        merge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 7v10M6 7c0 4 4 5 10 5"/></svg>',
        check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 7"/></svg>'
      };
      var QUESTS = [
        { id: 'email', icon: 'mail', title: 'Verify your email', desc: 'So we can reach you about your work.', reward: 10, cta: 'Verify', href: '#' },
        { id: 'profile', icon: 'user', title: 'Complete your contributor profile', desc: 'Pick your disciplines from the taxonomy.', reward: 25, cta: 'Fill in', href: '#' },
        { id: 'follow', icon: 'x', title: 'Follow @ArrowAir_ on X', desc: 'Flight tests land there first.', reward: 10, cta: 'Follow', href: 'https://x.com/ArrowAir_' },
        { id: 'verify-x', icon: 'shield', title: 'Verify your X account', desc: 'Link it so contributions can be credited.', reward: 15, cta: 'Verify', href: '#' },
        { id: 'intro', icon: 'chat', title: 'Introduce yourself on Discord', desc: 'One message in #introductions.', reward: 20, cta: 'Open Discord', href: 'https://discord.com/invite/arrow' },
        { id: 'call', icon: 'call', title: 'Attend a welcome call', desc: 'Earns the Member role on Discord.', reward: 50, cta: 'RSVP', href: 'https://discord.com/invite/arrow', featured: true, tag: 'Featured / next call Thu 25 Sep, 18:00 UTC' },
        { id: 'issue', icon: 'issue', title: 'Open your first issue', desc: 'A bug, a question, an idea. Any repo.', reward: 30, cta: 'Find a good first issue', href: 'https://github.com/Arrow-air' },
        { id: 'pr', icon: 'merge', title: 'Get your first PR accepted', desc: 'Unlocks Contribute.', reward: 100, cta: 'See open bounties', href: '#bounties' }
      ];
      var OB_KEY = 'arrow-app-onboarding';
      function obState() {
        try { return JSON.parse(localStorage.getItem(OB_KEY) || '{}'); } catch (e) { return {}; }
      }
      function obSave(st) { try { localStorage.setItem(OB_KEY, JSON.stringify(st)); } catch (e) {} }

      function questCard(q, done) {
        return '<div class="q' + (done ? ' is-done' : '') + '" data-quest="' + q.id + '">' +
          '<div class="q_icon">' + (done ? ICONS.check : ICONS[q.icon]) + '</div>' +
          '<div><h3 class="q_title">' + q.title + '</h3><p class="q_desc">' + q.desc + '</p></div>' +
          '<div class="q_side">' +
            '<span class="q_reward">' + (done ? '' : '+') + q.reward + ' $ARROW</span>' +
            (done
              ? '<button class="q_mark" type="button" data-undo="' + q.id + '">undo</button>'
              : '<a class="q_btn" href="' + q.href + '"' + (/^https?:/.test(q.href) ? ' target="_blank" rel="noopener"' : '') + '>' + q.cta + '</a>' +
                '<button class="q_mark" type="button" data-done="' + q.id + '">mark done</button>') +
          '</div>' +
        '</div>';
      }

      function renderOnboarding() {
        var st = obState();
        var doneCount = QUESTS.filter(function (q) { return st[q.id]; }).length;
        var earned = QUESTS.reduce(function (n, q) { return n + (st[q.id] ? q.reward : 0); }, 0);
        var feat = QUESTS.filter(function (q) { return q.featured && !st[q.id]; })[0];

        document.getElementById('ob-ring').setAttribute('stroke-dashoffset', String(113 - 113 * doneCount / QUESTS.length));
        document.getElementById('ob-ring-text').textContent = doneCount + '/' + QUESTS.length;
        document.getElementById('ob-earned').textContent = earned.toLocaleString();
        document.getElementById('ob-left').textContent = doneCount === QUESTS.length ? 'all done' : (QUESTS.length - doneCount) + ' step' + (QUESTS.length - doneCount === 1 ? '' : 's') + ' left';
        document.getElementById('ob-bar').style.width = (100 * doneCount / QUESTS.length) + '%';
        document.getElementById('ob-done').classList.toggle('is-on', doneCount === QUESTS.length);

        document.getElementById('ob-feat').innerHTML = feat
          ? '<div class="ob_feat"><div class="ob_icon">' + ICONS[feat.icon] + '</div>' +
            '<div><div class="ob_feat_tag">' + feat.tag + '</div><h3 class="q_title">' + feat.title + '</h3><p class="q_desc">' + feat.desc + '</p></div>' +
            '<div class="q_side"><span class="q_reward">+' + feat.reward + ' $ARROW</span><a class="q_btn is-primary" href="' + feat.href + '" target="_blank" rel="noopener">' + feat.cta + '</a><button class="q_mark" type="button" data-done="' + feat.id + '">mark done</button></div></div>'
          : '';
        document.getElementById('ob-grid').innerHTML = QUESTS.filter(function (q) { return !(q.featured && !st[q.id]); }).map(function (q) { return questCard(q, !!st[q.id]); }).join('');
      }

      document.getElementById('view-onboarding').addEventListener('click', function (e) {
        var t = e.target.closest('[data-done],[data-undo]');
        if (!t) return;
        var st = obState();
        if (t.hasAttribute('data-done')) st[t.getAttribute('data-done')] = true;
        else delete st[t.getAttribute('data-undo')];
        obSave(st);
        renderOnboarding();
      });

      // ---------------------------------------------------------------
      // Contribute: cards
      // ---------------------------------------------------------------
      var MARK = '<svg viewBox="0 0 163 194" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="M162.9,120.1l-50.36-11.17-31.09,84.49-31.09-84.49L0,120.1,81.45,0l81.45,120.1Z"/></svg>';

      // Card media: the docs site's dithered card art at rest, the colour
      // render on hover. Projects without art get the Arrow mark.
      function cardMedia(p) {
        if (!p.img) return '<div class="cf_media"><div class="cf_media_mark" style="color:' + p.color + '">' + MARK + '</div></div>';
        return '<div class="cf_media">' +
          '<img class="is-rest" src="/img/card-' + p.img + '_dark-unhover.png" alt="" loading="lazy">' +
          '<img class="is-hover" src="/img/' + (p.imgHover || 'card-' + p.img + '_hover.png') + '" alt="" loading="lazy">' +
        '</div>';
      }

      function renderCards() {
        grid.innerHTML = PROJECTS.map(function (p) {
          return '' +
            '<a class="cf" href="#contribute/' + p.id + '" style="--cf-color:' + p.color + '">' +
              cardMedia(p) +
              '<div class="cf_body">' +
                '<h3 class="cf_title">' + p.name + '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></h3>' +
                '<p class="cf_desc">' + p.blurb + '</p>' +
              '</div>' +
            '</a>';
        }).join('');
      }

      // ---------------------------------------------------------------
      // Contribute: project shell
      // ---------------------------------------------------------------
      function buildProjectTabs(p) {
        var names = p.tabs || BASE_TABS;
        projTabs.querySelectorAll('.app-tab').forEach(function (t) { t.remove(); });
        names.forEach(function (name, i) {
          var b = document.createElement('button');
          b.className = 'app-tab';
          b.type = 'button';
          b.setAttribute('role', 'tab');
          b.setAttribute('data-sub', slug(name));
          b.setAttribute('aria-selected', 'false');
          b.tabIndex = -1;
          b.innerHTML = '<span class="app-tab_num">' + String(i + 1).padStart(2, '0') + '</span>' + name;
          b.addEventListener('click', function () {
            location.hash = '#contribute/' + p.id + '/' + slug(name);
          });
          projTabs.appendChild(b);
        });
      }

      function disposeViewer() {
        if (viewer && viewer.dispose) viewer.dispose();
        viewer = null;
      }

      function mountViewer(host, opts) {
        var start = function () {
          window.ArrowViewer.mount(host, opts).then(function (v) {
            viewer = v;
            var l = host.querySelector('.v3d_loading');
            if (l) l.remove();
          }).catch(function (err) {
            host.innerHTML = '<div class="v3d_loading">Could not load the model (' + err + ')</div>';
          });
        };
        if (window.ArrowViewer) start();
        else window.addEventListener('arrow-viewer-ready', start, { once: true });
      }

      function renderProjectView(p, sub) {
        var names = p.tabs || BASE_TABS;
        var title = names.filter(function (n) { return slug(n) === sub; })[0] || names[0];
        disposeViewer();

        if (p.viewer && sub === 'overview') {
          projPanel.innerHTML =
            '<div class="proj_kicker">' + p.name + ' / ' + title + '</div>' +
            '<h3>' + p.name + ', assembled</h3>' +
            '<p style="margin-bottom:1rem">Orbit the aircraft. Hover a component to see what it is, click it to go deeper.</p>' +
            '<div class="v3d" id="v3d">' +
              '<div class="v3d_loading">Loading model</div>' +
              '<div class="v3d_tip" id="v3d-tip"></div>' +
              '<div class="v3d_hint">drag to orbit &middot; scroll to zoom &middot; click a part</div>' +
            '</div>';
          var host = document.getElementById('v3d');
          var tip = document.getElementById('v3d-tip');
          mountViewer(host, {
            base: '/app-models',
            accent: p.color,
            onHover: function (info) {
              if (!info) { tip.classList.remove('is-on'); return; }
              tip.innerHTML = info.label + ' <span>/ ' + info.system + '</span>';
              tip.classList.add('is-on');
            },
            onPick: function (info) {
              location.hash = '#contribute/' + p.id + '/component/' + encodeURIComponent(info.file + ':' + info.mesh);
            }
          });
          return;
        }

        if (p.viewer && sub === 'component') {
          var key = state.component ? decodeURIComponent(state.component) : '';
          var file = key.split(':')[0];
          var mesh = key.split(':').slice(1).join(':');
          if (!file) {
            projPanel.innerHTML =
              '<div class="proj_kicker">' + p.name + ' / ' + title + '</div>' +
              '<h3>' + title + '</h3>' +
              '<div class="v3d_empty">No component selected. Pick one in the <a href="#contribute/' + p.id + '/overview">3D overview</a>.</div>';
            return;
          }
          var systemLabel = file.replace(/^\d+_/, '').replace(/\.glb$/, '').replace(/_/g, ' ');
          var label = mesh.replace(/_\d+$/, '').replace(/[-_]/g, ' ') || 'component';
          projPanel.innerHTML =
            '<div class="v3d_crumbs"><a href="#contribute/' + p.id + '/overview">' + p.name + '</a> / <a href="#contribute/' + p.id + '/overview">' + systemLabel + '</a> / <b>' + label + '</b></div>' +
            '<h3>' + label + '</h3>' +
            '<p style="margin-bottom:1rem">Same CAD for now. Each component will link to its own model, drawings and tasks.</p>' +
            '<div class="v3d" id="v3d">' +
              '<div class="v3d_loading">Loading model</div>' +
              '<div class="v3d_hint">drag to orbit &middot; scroll to zoom</div>' +
            '</div>';
          mountViewer(document.getElementById('v3d'), { base: '/app-models', accent: p.color, focus: { file: file, mesh: mesh } });
          return;
        }

        projPanel.innerHTML =
          '<div class="proj_kicker">' + p.name + ' / ' + title + '</div>' +
          '<h3>' + title + '</h3>' +
          '<p>Placeholder for the ' + p.name + ' ' + title.toLowerCase() + ' view.</p>';
      }

      function showProject(p, sub, opts) {
        opts = opts || {};
        var names = p.tabs || BASE_TABS;
        var validSub = names.map(slug).indexOf(sub) >= 0 ? sub : slug(names[0]);
        var projectChanged = state.project !== p.id;

        if (projectChanged) {
          projShell.style.setProperty('--proj', p.color);
          projShell.style.setProperty('--proj-ink', isLight(p.color) ? '#101113' : '#ffffff');
          projName.textContent = p.name;
          buildProjectTabs(p);
        }
        gridWrap.style.display = 'none';
        projShell.classList.add('is-active');

        var subTabs = Array.prototype.slice.call(projTabs.querySelectorAll('.app-tab'));
        var active = subTabs.filter(function (t) { return t.getAttribute('data-sub') === validSub; })[0];

        function commit() {
          selectIn(projTabs, projIndicator, subTabs, active, projStem);
          renderProjectView(p, validSub);
        }

        var subChanged = state.sub !== validSub || state.component !== (opts.extra || null);
        state.project = p.id;
        state.sub = validSub;
        state.component = opts.extra || null;

        if (opts.instant || (!projectChanged && !subChanged)) {
          commit();
          // Layout settles after display flips; re-measure once.
          requestAnimationFrame(function () { positionIndicator(projTabs, projIndicator, active, projStem); });
        } else {
          selectIn(projTabs, projIndicator, subTabs, active, projStem);
          runLoader('Loading ' + p.name.toLowerCase() + (projectChanged ? '' : ' ' + validSub.replace(/-/g, ' ')), p.color, commit);
        }
      }

      function showGrid() {
        disposeViewer();
        projShell.classList.remove('is-active');
        gridWrap.style.display = '';
        state.project = null;
        state.sub = null;
      }

      // ---------------------------------------------------------------
      // Routing: #main, #contribute/project, #contribute/project/sub
      // ---------------------------------------------------------------
      function parseHash() {
        var parts = location.hash.replace(/^#/, '').split('/').filter(Boolean);
        return { main: parts[0] || tabs[0].getAttribute('data-tab'), project: parts[1] || null, sub: parts[2] || null, extra: parts[3] || null };
      }

      function showView(name) {
        views.forEach(function (v) { v.classList.toggle('is-active', v.id === 'view-' + name); });
      }

      function route(opts) {
        opts = opts || {};
        var r = parseHash();
        var tab = tabs.filter(function (t) { return t.getAttribute('data-tab') === r.main; })[0] || tabs[0];
        var main = tab.getAttribute('data-tab');
        var mainChanged = state.main !== main;

        if (mainChanged) {
          state.main = main;
          selectIn(tablist, indicator, tabs, tab, stem);
          panelIndex.textContent = String(tabs.indexOf(tab) + 1).padStart(2, '0');
          panelTitle.textContent = labelOf(tab);
        }

        function afterMain() {
          showView(main);
          if (main === 'contribute') {
            var p = r.project ? findProject(r.project) : null;
            if (p) showProject(p, r.sub, { instant: mainChanged || opts.instant, extra: r.extra });
            else showGrid();
          }
        }

        if (mainChanged && !opts.instant) {
          if (main === 'contribute') showGrid();
          runLoader('Loading ' + labelOf(tab).toLowerCase(), BLUE, afterMain);
        } else {
          afterMain();
        }
      }

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          location.hash = '#' + tab.getAttribute('data-tab');
        });
      });

      function keyNav(list, e) {
        var els = Array.prototype.slice.call(list.querySelectorAll('.app-tab'));
        var i = els.indexOf(document.activeElement);
        if (i < 0) return;
        var next = null;
        if (e.key === 'ArrowRight') next = els[(i + 1) % els.length];
        if (e.key === 'ArrowLeft') next = els[(i - 1 + els.length) % els.length];
        if (e.key === 'Home') next = els[0];
        if (e.key === 'End') next = els[els.length - 1];
        if (next) { e.preventDefault(); next.focus(); next.click(); }
      }
      tablist.addEventListener('keydown', function (e) { keyNav(tablist, e); });
      projTabs.addEventListener('keydown', function (e) { keyNav(projTabs, e); });

      // Fill the viewport below the sticky tab bar, leaving the shell's bottom padding.
      function sizePanel() {
        var top = panel.getBoundingClientRect().top + window.scrollY;
        var h = window.innerHeight - top - 24;
        panel.style.setProperty('--app-panel-h', Math.max(h, 320) + 'px');
      }

      window.addEventListener('resize', function () {
        sizePanel();
        var active = tabs.filter(function (t) { return t.getAttribute('aria-selected') === 'true'; })[0];
        if (active) positionIndicator(tablist, indicator, active, stem);
        if (state.project) {
          var sa = projTabs.querySelector('.app-tab[aria-selected="true"]');
          if (sa) positionIndicator(projTabs, projIndicator, sa, projStem);
        }
      });

      window.addEventListener('hashchange', function () { route(); });

      renderCards();
      renderOnboarding();
      sizePanel();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { route({ instant: true }); });
      } else {
        route({ instant: true });
      }
    })();
  </script>
