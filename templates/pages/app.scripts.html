      function isLight(hex) {
        var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6;
      }
      function slug(str) { return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

        for (var i = 0; i < PROJECTS.length; i++) if (PROJECTS[i].id === id) return PROJECTS[i];
        return null;
      }

      // ---------------------------------------------------------------
      // Shared pill + stem positioning (main bar and project bar)
      // ---------------------------------------------------------------
      function positionIndicator(list, ind, tab, stemEl) {
        // offsetLeft already includes the track's 4px padding, and the
        // absolutely positioned pill measures from the padding edge, so the
        // two line up without an adjustment.
        var x = tab.offsetLeft;
        ind.style.width = tab.offsetWidth + 'px';
        ind.style.transform = 'translateX(' + x + 'px)';
        var tabRect = tab.getBoundingClientRect();
        var wrapRect = stemEl.parentNode.getBoundingClientRect();
        stemEl.style.left = (tabRect.left + tabRect.width / 2 - wrapRect.left) + 'px';
      }

      function selectIn(list, ind, tabEls, tab, stemEl) {
        tabEls.forEach(function (t) {
          var on = t === tab;
          t.setAttribute('aria-selected', on ? 'true' : 'false');
          t.tabIndex = on ? 0 : -1;
        });
        positionIndicator(list, ind, tab, stemEl);
        tab.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
      }

      // ---------------------------------------------------------------
      // Loader
      // ---------------------------------------------------------------
      function runLoader(text, color, done) {
        if (loadTimer) clearTimeout(loadTimer);
        loader.style.setProperty('--loader-color', color || BLUE);
        loaderText.textContent = text;
        loader.classList.remove('is-visible');
        void loader.offsetWidth;
        loader.classList.add('is-visible');
        loadTimer = setTimeout(function () {
          loader.classList.remove('is-visible');
          done();
        }, LOAD_MS);
      }

      var OB_KEY = 'arrow-app-onboarding';
      function obState() {
        try { return JSON.parse(localStorage.getItem(OB_KEY) || '{}'); } catch (e) { return {}; }
      }
      function obSave(st) { try { localStorage.setItem(OB_KEY, JSON.stringify(st)); } catch (e) {} }

      function questCard(q, done) {
        return '<div class="q' + (done ? ' is-done' : '') + '" data-quest="' + q.id + '"><div class="q_in">' +
          '<div class="q_icon">' + (done ? ICONS.check : ICONS[q.icon]) + '</div>' +
          '<div><h3 class="q_title">' + q.title + '</h3><p class="q_desc">' + q.desc + '</p></div>' +

            '<span class="q_reward">' + (done ? '' : '+') + q.reward + ' $ARROW</span>' +
            (done
              ? '<button class="q_mark" type="button" data-undo="' + q.id + '">undo</button>'
              : '<a class="q_btn" href="' + q.href + '"' + (/^https?:/.test(q.href) ? ' target="_blank" rel="noopener"' : '') + '>' + q.cta + '</a>' +
                '<button class="q_mark" type="button" data-done="' + q.id + '">mark done</button>') +
          '</div>' +
        '</div></div>';
      }

      function renderOnboarding() {
        var st = obState();
        var doneCount = QUESTS.filter(function (q) { return st[q.id]; }).length;
        var earned = QUESTS.reduce(function (n, q) { return n + (st[q.id] ? q.reward : 0); }, 0);
        var feat = QUESTS.filter(function (q) { return q.featured && !st[q.id]; })[0];

        document.getElementById('ob-ring').setAttribute('stroke-dashoffset', String(113 - 113 * doneCount / QUESTS.length));
        document.getElementById('ob-ring-text').textContent = doneCount + '/' + QUESTS.length;
        document.getElementById('ob-earned').textContent = earned.toLocaleString();
        document.getElementById('ob-left').textContent = doneCount === QUESTS.length ? 'all done' : (QUESTS.length - doneCount) + ' step' + (QUESTS.length - doneCount === 1 ? '' : 's') + ' left';
        document.getElementById('ob-bar').style.width = (100 * doneCount / QUESTS.length) + '%';
        document.getElementById('ob-done').classList.toggle('is-on', doneCount === QUESTS.length);

        document.getElementById('ob-feat').innerHTML = feat
          ? '<div class="ob_feat"><div class="ob_icon">' + ICONS[feat.icon] + '</div>' +
            '<div><div class="ob_feat_tag">' + feat.tag + '</div><h3 class="q_title">' + feat.title + '</h3><p class="q_desc">' + feat.desc + '</p></div>' +

      }

                  (t.comp ? '<span class="kb_tag is-comp">' + t.comp + '</span>' : '') +
                  t.tags.map(function (g) { return '<span class="kb_tag">' + g + '</span>'; }).join('') +
                '</div>' +
                (t.who ? '<span class="kb_who" title="' + t.who + '">' + t.who + '</span>' : '<span class="kb_who is-empty" title="Unassigned">+</span>') +
                '</div>' +
              '</div>';
            }).join('') +
          '</div>';
        }).join('') + '</div>' +
        '<div class="kb_foot">Dummy board. Will mirror the ' + p.name + ' GitHub Projects view. Drag cards to try it.</div>';
      }

      function wireKanban(p) {
        var board = document.getElementById('kb');
        if (!board) return;
        var dragging = null;
        board.addEventListener('dragstart', function (e) {
          var card = e.target.closest('.kb_card');
          if (!card) return;
          dragging = card;
          card.classList.add('is-dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', card.getAttribute('data-n'));
        });
        board.addEventListener('dragend', function () {
          if (dragging) dragging.classList.remove('is-dragging');
          dragging = null;
          board.querySelectorAll('.kb_col').forEach(function (c) { c.classList.remove('is-over'); });
        });
        board.addEventListener('dragover', function (e) {
          var col = e.target.closest('.kb_col');
          if (!col) return;
          e.preventDefault();
          board.querySelectorAll('.kb_col').forEach(function (c) { c.classList.toggle('is-over', c === col); });
        });
        board.addEventListener('drop', function (e) {
          var col = e.target.closest('.kb_col');
          if (!col || !dragging) return;
          e.preventDefault();
          kbState[p.id][dragging.getAttribute('data-n')] = col.getAttribute('data-col');
          projPanel.querySelector('#kb').outerHTML = renderKanban(p).replace(/<div class="kb_foot">[\s\S]*$/, '');
          wireKanban(p);
        });
      }

          b.type = 'button';
          b.setAttribute('role', 'tab');

          b.innerHTML = '<span class="app-tab_num">' + String(i + 1).padStart(2, '0') + '</span>' + name;

        if (viewer && viewer.dispose) viewer.dispose();

            host.innerHTML = '<div class="v3d_loading">Could not load the model (' + err + ')</div>';

      // ---------------------------------------------------------------
      // About: the project's README from GitHub, rendered below the
      // viewer, bounties and steps. Fetched once per project.
      // ---------------------------------------------------------------
      var readmeCache = {};
      function aboutSection(p) {
        if (!p.repo) return '';
        return '<div class="sec" id="about-sec"><div class="sec_head"><h4>About ' + p.name + '</h4>' +
          '<span><a class="sec_link" href="https://github.com/Arrow-air/' + p.repo + '" target="_blank" rel="noopener">github.com/Arrow-air/' + p.repo + '</a></span></div>' +
          '<div class="readme" id="about-body"><div class="bt_empty">Loading README from GitHub</div></div></div>';
      }
      function loadAbout(p) {
        var body = document.getElementById('about-body');
        if (!p.repo || !body) return;
        var render = function (md) {
          if (!window.marked) { body.innerHTML = '<pre class="readme_raw">' + md.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }) + '</pre>'; return; }
          var rawBase = 'https://raw.githubusercontent.com/Arrow-air/' + p.repo + '/main/';
          var blobBase = 'https://github.com/Arrow-air/' + p.repo + '/blob/main/';
          var renderer = new marked.Renderer();
          renderer.image = function (href, title, text) {
            var src = typeof href === 'object' ? href.href : href;
            var alt = typeof href === 'object' ? href.text : text;
            if (!/^https?:/.test(src)) src = rawBase + src.replace(/^\.\//, '');
            return '<img src="' + src + '" alt="' + (alt || '') + '" loading="lazy">';
          };
          renderer.link = function (href, title, text) {
            var h = typeof href === 'object' ? href.href : href;
            var t = typeof href === 'object' ? href.text : text;
            if (!/^https?:|^#|^mailto:/.test(h)) h = blobBase + h.replace(/^\.\//, '');
            return '<a href="' + h + '" target="_blank" rel="noopener">' + t + '</a>';
          };
          body.innerHTML = marked.parse(md, { renderer: renderer, gfm: true });
        };
        if (readmeCache[p.repo]) { render(readmeCache[p.repo]); return; }
        var tryBranch = function (branch) {
          return fetch('https://raw.githubusercontent.com/Arrow-air/' + p.repo + '/' + branch + '/README.md').then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
          });
        };
        tryBranch('main').catch(function () { return tryBranch('master'); }).then(function (md) {
          readmeCache[p.repo] = md;
          if (document.getElementById('about-body') === body) render(md);
        }).catch(function (err) {
          body.innerHTML = '<div class="bt_empty">Could not load the README (' + err.message + ').</div>';
        });
      }

      function componentSections(p, file, mesh, label) {
        var all = BOUNTIES.filter(function (b) { return b.project === p.id; });
        var related = all.filter(function (b) { return bountyMatches(b, file, mesh); });
        var rest = all.filter(function (b) { return !bountyMatches(b, file, mesh); });
        var viewerHtml =
          '<div class="v3d" id="v3d">' +
            '<div class="v3d_loading">Loading model</div>' +
            '<div class="v3d_hint">drag to orbit &middot; scroll to zoom</div>' +
          '</div>';
        var html = frame(label, '', 'same CAD for now', viewerHtml);
        if (related.length) {
          html += bountyFrame('Bounties on this component', related.length + ' related', 'paid in USDC and $ARROW', bountyTable(related, { file: file, mesh: mesh }));
        }
        html += '<div class="sec"><div class="sec_head"><h4>' + (related.length ? 'Or improve it your own way' : 'How to improve this component') + '</h4><span>5 steps</span></div>' +
          improveSteps(p, label) + '</div>';
        html += bountyFrame(related.length ? 'Other ' + p.name + ' bounties' : 'All ' + p.name + ' bounties', rest.length + ' listed', 'paid in USDC and $ARROW', bountyTable(rest));
        return html;
      }

      function showProject(p, sub, opts) {
        opts = opts || {};
        var names = p.tabs || BASE_TABS;
        var validSub = names.map(slug).indexOf(sub) >= 0 ? sub : slug(names[0]);
        var projectChanged = state.project !== p.id;

        if (projectChanged) {
          projShell.style.setProperty('--proj', p.color);
          projShell.style.setProperty('--proj-ink', isLight(p.color) ? '#101113' : '#ffffff');
          projName.textContent = p.name;
          buildProjectTabs(p);
        }
        gridWrap.style.display = 'none';
        projShell.classList.add('is-active');

        var subTabs = Array.prototype.slice.call(projTabs.querySelectorAll('.app-tab'));
        var active = subTabs.filter(function (t) { return t.getAttribute('data-sub') === validSub; })[0];

        function commit() {
          selectIn(projTabs, projIndicator, subTabs, active, projStem);
          renderProjectView(p, validSub);
        }

        var subChanged = state.sub !== validSub || state.component !== (opts.extra || null);
        state.project = p.id;
        state.sub = validSub;
        state.component = opts.extra || null;

        if (opts.instant || (!projectChanged && !subChanged)) {
          commit();
          // Layout settles after display flips; re-measure once.
          requestAnimationFrame(function () { positionIndicator(projTabs, projIndicator, active, projStem); });
        } else {
          selectIn(projTabs, projIndicator, subTabs, active, projStem);
          runLoader('Loading ' + p.name.toLowerCase() + (projectChanged ? '' : ' ' + validSub.replace(/-/g, ' ')), p.color, commit);
        }
      }

      var flyName = document.getElementById('fly-name');

        }
        if ((t = e.target.closest('[data-avail]'))) {
          var a = t.getAttribute('data-avail'); var al = wz.data.availability || [];
          var j = al.indexOf(a); if (j >= 0) al.splice(j, 1); else al.push(a);
          wz.data.availability = al; renderWizard(); return;
        }
        if (e.target.closest('#wz-next')) { if (wzValid(WZ_STEPS[wz.step])) { if (wz.step === WZ_STEPS.length - 1) wzFinish(); wzGo(wz.step + 1); } return; }
        if (e.target.closest('#wz-skip')) { if (wz.step === WZ_STEPS.length - 1) wzFinish(); wzGo(wz.step + 1); return; }
        if (e.target.closest('#wz-back')) { wzGo(wz.step - 1); return; }
        if (e.target.closest('#wz-finish')) { showStart(null, { instant: true }); return; }
        if (e.target.closest('#wz-redo')) { e.preventDefault(); try { localStorage.removeItem(PROFILE_KEY); } catch (err) {} wz = { step: 0, data: {} }; renderWizard(); return; }
      });
      wzHost.addEventListener('input', function (e) {
        var f = e.target.getAttribute('data-f'); if (!f) return;
        wz.data[f] = e.target.value;
        var next = document.getElementById('wz-next'); if (next) next.disabled = !wzValid(WZ_STEPS[wz.step]);
        draftSave();
      });
      wzHost.addEventListener('change', function (e) {
        var f = e.target.getAttribute('data-f'); if (!f) return;
        wz.data[f] = e.target.value;
        var next = document.getElementById('wz-next'); if (next) next.disabled = !wzValid(WZ_STEPS[wz.step]);
        draftSave();
      });
      function showStart(sub, opts) {
        var prof = profileGet();
        var wantWizard = sub === 'profile' || !prof;
        if (wantWizard) {
          if (sub === 'profile' && prof) { wz = { step: 0, data: JSON.parse(JSON.stringify(prof)) }; }
          else { var dr = draftGet(); if (dr && dr.data) wz = dr; }
          if (wz.step >= WZ_STEPS.length) wz.step = 0;
          wzHost.classList.add('is-active'); obQuests.style.display = 'none';
          renderWizard();
        } else {
          wzHost.classList.remove('is-active'); obQuests.style.display = '';
          if (sub !== 'profile' && location.hash.indexOf('#start/') === 0) history.replaceState(null, '', '#start');
        }
      }

      function showGrid() {
        disposeViewer();
        projShell.classList.remove('is-active');
        gridWrap.style.display = '';
        state.project = null;
        state.sub = null;
      }

      // ---------------------------------------------------------------
      // Routing: #main, #contribute/project, #contribute/project/sub, #dao/sub
      // ---------------------------------------------------------------
      function parseHash() {
        var parts = location.hash.replace(/^#/, '').split('/').filter(Boolean);
        return { main: parts[0] || tabs[0].getAttribute('data-tab'), project: parts[1] || null, sub: parts[2] || null, extra: parts[3] || null };
      }

      function showView(name) {
        views.forEach(function (v) { v.classList.toggle('is-active', v.id === 'view-' + name); });
      }

      function route(opts) {
        opts = opts || {};
        var r = parseHash();
        var shell = document.querySelector('.app-shell');
        if (r.main === 'me') {
          var meChanged = state.main !== 'me';
          state.main = 'me';
          tabs.forEach(function (t) { t.setAttribute('aria-selected', 'false'); t.tabIndex = -1; });
          tablist.classList.add('is-none'); shell.classList.add('is-none');
          panelIndex.textContent = '--';
          panelTitle.textContent = 'Dashboard';
          var showMe = function () { showView('me'); renderMe(); };
          if (meChanged && !opts.instant) runLoader('Loading your dashboard', BLUE, showMe); else showMe();
          return;
        }
        tablist.classList.remove('is-none'); shell.classList.remove('is-none');
        var tab = tabs.filter(function (t) { return t.getAttribute('data-tab') === r.main; })[0] || tabs[0];
        var main = tab.getAttribute('data-tab');
        var mainChanged = state.main !== main;

        if (mainChanged) {
          state.main = main;
          selectIn(tablist, indicator, tabs, tab, stem);
          panelIndex.textContent = String(tabs.indexOf(tab) + 1).padStart(2, '0');
          panelTitle.textContent = labelOf(tab);
        }

        function afterMain() {
          showView(main);
          if (main === 'contribute') {
            var p = r.project ? findProject(r.project) : null;
            if (p) showProject(p, r.sub, { instant: mainChanged || opts.instant, extra: r.extra });
            else showGrid();
          }
          if (main === 'start') showStart(r.project, { instant: mainChanged || opts.instant });
          if (main === 'dao') showDao(r.project, { instant: mainChanged || opts.instant });
          if (main === 'fly') showFly(r.project, r.sub, { instant: mainChanged || opts.instant });
        }

        if (mainChanged && !opts.instant) {
          if (main === 'contribute') showGrid();
          runLoader('Loading ' + labelOf(tab).toLowerCase(), BLUE, afterMain);
        } else {
          afterMain();
        }
      }

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          location.hash = '#' + tab.getAttribute('data-tab');
        });
      });

      function keyNav(list, e) {
        var els = Array.prototype.slice.call(list.querySelectorAll('.app-tab'));
        var i = els.indexOf(document.activeElement);
        if (i < 0) return;
        var next = null;
        if (e.key === 'ArrowRight') next = els[(i + 1) % els.length];
        if (e.key === 'ArrowLeft') next = els[(i - 1 + els.length) % els.length];
        if (e.key === 'Home') next = els[0];
        if (e.key === 'End') next = els[els.length - 1];
        if (next) { e.preventDefault(); next.focus(); next.click(); }
      }
      tablist.addEventListener('keydown', function (e) { keyNav(tablist, e); });
      projTabs.addEventListener('keydown', function (e) { keyNav(projTabs, e); });
      daoTabs.addEventListener('keydown', function (e) { keyNav(daoTabs, e); });
      flyTabs.addEventListener('keydown', function (e) { keyNav(flyTabs, e); });

      // Fill the viewport below the sticky tab bar, leaving the shell's bottom padding.
      function sizePanel() {
        var top = panel.getBoundingClientRect().top + window.scrollY;
        var h = window.innerHeight - top - 24;
        panel.style.setProperty('--app-panel-h', Math.max(h, 320) + 'px');
      }

      window.addEventListener('resize', function () {
        sizePanel();
        var active = tabs.filter(function (t) { return t.getAttribute('aria-selected') === 'true'; })[0];
        if (active) positionIndicator(tablist, indicator, active, stem);
        if (state.project) {
          var sa = projTabs.querySelector('.app-tab[aria-selected="true"]');
          if (sa) positionIndicator(projTabs, projIndicator, sa, projStem);
        }
        if (state.main === 'dao') {
          var da = daoTabs.querySelector('.app-tab[aria-selected="true"]');
          if (da) positionIndicator(daoTabs, daoIndicator, da, daoStem);
        }
        if (state.main === 'fly') {
          var fa = flyTabs.querySelector('.app-tab[aria-selected="true"]');
          if (fa) positionIndicator(flyTabs, flyIndicator, fa, flyStem);
        }
      });

      window.addEventListener('hashchange', function () { route(); });

      // ---------------------------------------------------------------
      // Wallet sheet (coss ui inset sheet). Opens from the profile /
      // balance widget in the navbar. Balances and activity are
      // illustrative; only the onboarding rewards come from real state.
      // ---------------------------------------------------------------
      (function () {
        var sheet = document.getElementById('wallet-sheet');
        var trigger = document.getElementById('app-user');
        if (!sheet || !trigger) return;
        var popup = sheet.querySelector('.sheet_popup');
        var closeBtn = sheet.querySelector('.sheet_close');
        var activity = document.getElementById('wl-activity');
        var lastFocus = null;
        var ACT_ICON = {
          plus: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
          minus: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
          bounty: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>'
        };
        function renderActivity() {
          var st = obState();
          var rows = QUESTS.filter(function (q) { return st[q.id]; }).map(function (q) {
            return { t: q.title, s: 'Onboarding reward', amt: '+' + q.reward + ' ARROW', k: 'plus' };
          }).reverse();
          rows = rows.concat([
            { t: 'Bounty paid: Assembly guide photos', s: 'Quiver &middot; 14 Sep', amt: '+120.00 USDC', k: 'bounty' },
            { t: 'Bounty paid: Assembly guide photos', s: 'Quiver &middot; 14 Sep', amt: '+600 ARROW', k: 'bounty' },
            { t: 'Store: Quiver landing gear feet', s: '02 Sep', amt: '-180 ARROW', k: 'minus' }
          ]);
          activity.innerHTML = rows.length ? rows.map(function (r) {
            var cls = r.k === 'minus' ? 'is-minus' : 'is-plus';
            return '<div class="wl_row"><span class="wl_row_ic">' + ACT_ICON[r.k] + '</span>' +
              '<div class="wl_row_main"><div class="wl_row_t">' + r.t + '</div><div class="wl_row_s">' + r.s + '</div></div>' +
              '<div class="wl_row_amt ' + cls + '"><b>' + r.amt + '</b></div></div>';
          }).join('') : '<div class="bt_empty">No activity yet.</div>';
        }
        function open() {
          lastFocus = document.activeElement;
          renderActivity();
          sheet.classList.add('is-open');
          sheet.setAttribute('aria-hidden', 'false');
          trigger.setAttribute('aria-expanded', 'true');
          document.body.style.overflow = 'hidden';
          void popup.offsetWidth;
          sheet.classList.add('is-in');
          closeBtn.focus();
        }
        function close() {
          sheet.classList.remove('is-in');
          trigger.setAttribute('aria-expanded', 'false');
          document.body.style.overflow = '';
          var done = function () {
            sheet.classList.remove('is-open');
            sheet.setAttribute('aria-hidden', 'true');
            if (lastFocus && lastFocus.focus) lastFocus.focus();
          };
          var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (reduced) done(); else setTimeout(done, 200);
        }
        trigger.addEventListener('click', function () {
          if (sheet.classList.contains('is-open')) close(); else open();
        });
        sheet.addEventListener('click', function (e) {
          if (e.target.closest('[data-sheet-close]')) close();
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && sheet.classList.contains('is-open')) close();
        });
        // Keep tab focus inside the sheet while it is open
        sheet.addEventListener('keydown', function (e) {
          if (e.key !== 'Tab') return;
          var f = popup.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])');
          if (!f.length) return;
          var first = f[0], last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        });
        var copy = document.getElementById('wl-copy');
        copy.addEventListener('click', function () {
          var addr = '0x7a3F2b19c0dE4f5A6b7C8d9E0f1A2b3C4d5E9C4e';
          var label = document.getElementById('wl-addr');
          var restore = label.innerHTML;
          var flash = function () { label.textContent = 'Copied'; setTimeout(function () { label.innerHTML = restore; }, 1200); };
          if (navigator.clipboard) navigator.clipboard.writeText(addr).then(flash, flash); else flash();
        });
        document.getElementById('wl-disconnect').addEventListener('click', function () {
          trigger.classList.remove('is-connected');
          sheet.querySelector('.wl_status').textContent = 'Disconnected';
          sheet.querySelector('.wl_status').style.color = 'var(--app-muted)';
          close();
        });
      })();

      (function () { var pf = profileGet(); var nm = document.querySelector('.app-user_name'); if (pf && pf.name && nm) nm.textContent = pf.name; })();
      renderCards();
      renderOnboarding();
      sizePanel();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { route({ instant: true }); });
      } else {
        route({ instant: true });
      }
    })();
  </script>
