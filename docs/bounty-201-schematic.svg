<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <style>
    .component { fill: #e8f4f8; stroke: #2c5aa0; stroke-width: 2; }
    .wire { stroke: #d32f2f; stroke-width: 3; fill: none; }
    .wire-gnd { stroke: #424242; stroke-width: 3; fill: none; }
    .text { font-family: Arial, sans-serif; font-size: 14px; fill: #1a1a1a; }
    .label { font-family: Arial, sans-serif; font-size: 12px; fill: #555; }
    .voltage { font-family: monospace; font-size: 11px; fill: #d32f2f; font-weight: bold; }
  </style>
  
  <!-- Title -->
  <text x="400" y="30" class="text" font-size="20" font-weight="bold" text-anchor="middle">Electrical System Schematic - Bounty #201</text>
  
  <!-- Battery -->
  <rect x="50" y="80" width="120" height="80" class="component" rx="5"/>
  <text x="110" y="110" class="text" text-anchor="middle" font-weight="bold">Battery Pack</text>
  <text x="110" y="130" class="label" text-anchor="middle">48V 20Ah</text>
  <text x="110" y="145" class="label" text-anchor="middle">LiFePO4</text>
  
  <!-- Main Breaker -->
  <rect x="220" y="100" width="80" height="40" class="component" rx="3"/>
  <text x="260" y="125" class="text" text-anchor="middle" font-size="12">Breaker</text>
  <text x="260" y="138" class="label" text-anchor="middle">200A</text>
  
  <!-- Bus Bar -->
  <rect x="350" y="80" width="30" height="400" class="component" rx="3"/>
  <text x="365" y="70" class="text" text-anchor="middle" font-weight="bold">+48V Bus</text>
  
  <!-- Power lines from battery -->
  <line x1="170" y1="120" x2="220" y2="120" class="wire"/>
  <text x="195" y="115" class="voltage">+48V</text>
  <line x1="300" y1="120" x2="350" y2="120" class="wire"/>
  
  <!-- Motor Controller 1 -->
  <rect x="450" y="100" width="140" height="60" class="component" rx="5"/>
  <text x="520" y="125" class="text" text-anchor="middle" font-weight="bold">Motor ESC 1</text>
  <text x="520" y="142" class="label" text-anchor="middle">48V 200A</text>
  <text x="520" y="155" class="label" text-anchor="middle">8kW Peak</text>
  <line x1="380" y1="130" x2="450" y2="130" class="wire"/>
  <circle cx="410" cy="130" r="8" fill="white" stroke="#2c5aa0" stroke-width="2"/>
  <text x="410" y="134" class="label" text-anchor="middle" font-size="10">180A</text>
  
  <!-- Motor 1 -->
  <circle cx="650" cy="130" r="35" class="component"/>
  <text x="650" y="135" class="text" text-anchor="middle" font-weight="bold">M1</text>
  <line x1="590" y1="130" x2="615" y2="130" class="wire"/>
  
  <!-- Motor Controller 2 -->
  <rect x="450" y="200" width="140" height="60" class="component" rx="5"/>
  <text x="520" y="225" class="text" text-anchor="middle" font-weight="bold">Motor ESC 2</text>
  <text x="520" y="242" class="label" text-anchor="middle">48V 200A</text>
  <text x="520" y="255" class="label" text-anchor="middle">8kW Peak</text>
  <line x1="380" y1="230" x2="450" y2="230" class="wire"/>
  <circle cx="410" cy="230" r="8" fill="white" stroke="#2c5aa0" stroke-width="2"/>
  <text x="410" y="234" class="label" text-anchor="middle" font-size="10">180A</text>
  
  <!-- Motor 2 -->
  <circle cx="650" cy="230" r="35" class="component"/>
  <text x="650" y="235" class="text" text-anchor="middle" font-weight="bold">M2</text>
  <line x1="590" y1="230" x2="615" y2="230" class="wire"/>
  
  <!-- DC-DC Converter 1 -->
  <rect x="450" y="310" width="140" height="50" class="component" rx="5"/>
  <text x="520" y="330" class="text" text-anchor="middle" font-weight="bold">DC-DC Conv 1</text>
  <text x="520" y="347" class="label" text-anchor="middle">48V→12V 30A</text>
  <line x1="380" y1="335" x2="450" y2="335" class="wire"/>
  <circle cx="410" cy="335" r="8" fill="white" stroke="#2c5aa0" stroke-width="2"/>
  <text x="410" y="339" class="label" text-anchor="middle" font-size="10">40A</text>
  
  <!-- 12V Bus -->
  <rect x="640" y="320" width="30" height="100" class="component" rx="3"/>
  <text x="655" y="310" class="text" text-anchor="middle" font-weight="bold">+12V</text>
  <line x1="590" y1="335" x2="640" y2="335" stroke="#ff6f00" stroke-width="3" fill="none"/>
  <text x="615" y="330" class="voltage" fill="#ff6f00">+12V</text>
  
  <!-- DC-DC Converter 2 (Redundant) -->
  <rect x="450" y="390" width="140" height="50" class="component" rx="5"/>
  <text x="520" y="410" class="text" text-anchor="middle" font-weight="bold">DC-DC Conv 2</text>
  <text x="520" y="427" class="label" text-anchor="middle">48V→12V 30A</text>
  <line x1="380" y1="415" x2="450" y2="415" class="wire"/>
  <circle cx="410" cy="415" r="8" fill="white" stroke="#2c5aa0" stroke-width="2"/>
  <text x="410" y="419" class="label" text-anchor="middle" font-size="10">40A</text>
  <line x1="590" y1="415" x2="640" y2="385" stroke="#ff6f00" stroke-width="3" fill="none"/>
  
  <!-- Avionics Load -->
  <rect x="710" y="350" width="70" height="40" class="component" rx="3"/>
  <text x="745" y="373" class="text" text-anchor="middle" font-size="12">Avionics</text>
  <line x1="670" y1="370" x2="710" y2="370" stroke="#ff6f00" stroke-width="3" fill="none"/>
  
  <!-- Ground Bus -->
  <rect x="50" y="500" width="700" height="30" fill="#424242" rx="3"/>
  <text x="400" y="520" class="text" fill="white" text-anchor="middle" font-weight="bold">Ground Bus Bar (0V)</text>
  
  <!-- Ground connections -->
  <line x1="110" y1="160" x2="110" y2="500" class="wire-gnd"/>
  <line x1="365" y1="480" x2="365" y2="500" class="wire-gnd"/>
  <line x1="520" y1="160" x2="520" y2="500" class="wire-gnd" stroke-dasharray="5,5"/>
  <line x1="520" y1="260" x2="520" y2="500" class="wire-gnd" stroke-dasharray="5,5"/>
  <line x1="655" y1="420" x2="655" y2="500" class="wire-gnd"/>
  <line x1="650" y1="165" x2="650" y2="500" class="wire-gnd" stroke-dasharray="5,5"/>
  <line x1="650" y1="265" x2="650" y2="500" class="wire-gnd" stroke-dasharray="5,5"/>
  
  <!-- Legend -->
  <text x="50" y="570" class="label" font-weight="bold">Legend:</text>
  <line x1="120" y1="565" x2="160" y2="565" class="wire"/>
  <text x="165" y="570" class="label">48V Power</text>
  <line x1="250" y1="565" x2="290" y2="565" stroke="#ff6f00" stroke-width="3" fill="none"/>
  <text x="295" y="570" class="label">12V Power</text>
  <line x1="380" y1="565" x2="420" y2="565" class="wire-gnd"/>
  <text x="425" y="570" class="label">Ground</text>
</svg>
