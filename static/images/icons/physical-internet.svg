  <rect x="40" y="36" width="4" height="4" fill="white"/>
  <rect x="48" y="36" width="4" height="4" fill="white"/>
  <!-- Globe outline bottom -->
  <rect x="4" y="32" width="4" height="4" fill="white"/>
